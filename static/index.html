<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#FFE600">
<title>Aksi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@800;900&family=Noto+Sans+Devanagari:wght@800&family=Noto+Sans+Telugu:wght@800&family=Noto+Sans+Tamil:wght@800&family=Noto+Sans+Kannada:wght@800&family=Noto+Sans+Malayalam:wght@800&family=Noto+Sans+Bengali:wght@800&family=Noto+Sans+Gujarati:wght@800&family=Noto+Sans+Gurmukhi:wght@800&family=Noto+Sans+Oriya:wght@800&display=swap">
<style>
  /* Loud design: the whole screen's colour IS the state.
     yellow = start / looking, camera = ready, red = listening, white = answer, stripes = error */
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; user-select: none; -webkit-user-select: none;
    -webkit-touch-callout: none;
    font-family: 'Archivo', 'Noto Sans Devanagari', 'Noto Sans Telugu', 'Noto Sans Tamil', 'Noto Sans Kannada',
      'Noto Sans Malayalam', 'Noto Sans Bengali', 'Noto Sans Gujarati', 'Noto Sans Gurmukhi', 'Noto Sans Oriya',
      system-ui, sans-serif; }
  body { background: #000; color: #fff; }
  body[data-state=start], body[data-state=looking] { background: #FFE600; color: #000; }
  body[data-state=listening] { background: #FF3B30; color: #000; }
  body[data-state=answer] { background: #fff; color: #000; }
  body[data-state=error] { background: repeating-linear-gradient(-45deg, #FFE600 0 36px, #000 36px 72px); }

  /* The feed must keep playing (we snap the photo from it), so hide it with opacity, not display */
  video { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; }
  body[data-state=ready] video { opacity: 1; }

  button { all: unset; box-sizing: border-box; cursor: pointer; touch-action: none;
    -webkit-tap-highlight-color: transparent; }
  button:focus-visible { outline: 6px solid #00A3FF; outline-offset: -6px; }

  /* Top strip: repeat the last answer. The top edge is easy to find by touch. */
  #repeat { position: fixed; top: 0; left: 0; right: 0; height: 120px; padding: 0 24px; display: flex;
    align-items: center; gap: 16px; background: #FFE600; color: #000; border-bottom: 6px solid #000; }
  body[data-state=listening] #repeat { background: #FF3B30; }
  body[data-state=start] #repeat { display: none; }
  #repeat svg { flex: none; }
  #repMain { display: block; font-size: min(30px, 7.5vw); font-weight: 800; line-height: 1.15; }
  #repSub { display: block; font-size: 15px; font-weight: 900; letter-spacing: .06em; }

  /* Everything below the strip is the ask button */
  #pad { position: fixed; top: 120px; left: 0; right: 0; bottom: 0; display: flex; }
  body[data-state=start] #pad { top: 0; }
  #content { flex: 1; min-width: 0; display: flex; flex-direction: column; justify-content: flex-end; }
  body[data-state=start] #content { padding: 28px 24px 40px; justify-content: space-between; }
  body[data-state=listening] #content,
  body[data-state=looking] #content { padding: 36px 24px; justify-content: space-between; }
  body[data-state=answer] #content { justify-content: flex-start; }

  /* Three-line language stack: user's language biggest, then Hindi, then English */
  .stack { display: flex; flex-direction: column; gap: 10px; }
  .big { font-size: min(58px, 14.5vw); font-weight: 800; line-height: 1.12; overflow-wrap: anywhere; }
  .mid { font-size: min(36px, 9vw); font-weight: 800; line-height: 1.2; }
  /* Long words like వింటున్నాను… must fit on one line with their "…" */
  body[data-state=listening] .big, body[data-state=looking] .big { font-size: min(50px, 12.5vw); }
  .small { font-size: min(22px, 5.6vw); font-weight: 900; letter-spacing: .12em; }

  .slab { background: #000; color: #fff; padding: 20px 24px 36px; display: flex; flex-direction: column; gap: 10px; }
  body[data-state=listening] .slab, body[data-state=looking] .slab { padding: 14px 16px; gap: 6px; }
  .tag { align-self: flex-start; background: #FFE600; color: #000; font-size: 13px; font-weight: 900;
    letter-spacing: .15em; padding: 4px 10px; }
  .sl1 { font-size: min(26px, 6.5vw); font-weight: 800; }
  .sl2 { font-size: 17px; font-weight: 800; }

  .logo-wrap { margin-top: 40px; }
  .logo { font-size: min(132px, 30vw); font-weight: 900; line-height: .86; letter-spacing: -.045em; margin-left: -4px; }
  .logo-sub { margin-top: 10px; font-size: min(28px, 7vw); font-weight: 800; letter-spacing: .04em; }
  .group { display: flex; flex-direction: column; gap: 14px; }
  .rule { height: 14px; background: #000; }
  .note { font-size: 17px; font-weight: 800; line-height: 1.4; }

  .bars { display: flex; align-items: flex-end; gap: 10px; height: 120px; }
  .bars span { width: 26px; height: 100%; background: #000; transform-origin: bottom;
    animation: bar .9s ease-in-out infinite alternate; }
  .bars span:nth-child(2n) { animation-duration: .7s; }
  .bars span:nth-child(3n) { animation-duration: 1.1s; animation-delay: -.3s; }
  @keyframes bar { from { transform: scaleY(.2); } to { transform: scaleY(1); } }
  .squares { display: flex; gap: 18px; }
  .squares span { width: 64px; height: 64px; background: #000; animation: blink 1.2s infinite; }
  .squares span:nth-child(2) { animation-delay: .2s; }
  .squares span:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%, 100% { opacity: .2; } 50% { opacity: 1; } }
  /* A little motion: colour flood fades in, each new screen's blocks rise in one after another */
  body, #repeat { transition: background-color .25s ease, color .25s ease; }
  #content > * { animation: rise .32s cubic-bezier(.2, .9, .3, 1.2) both; }
  #content > *:nth-child(2) { animation-delay: .06s; }
  #content > *:nth-child(3) { animation-delay: .12s; }
  .stack > * { animation: rise .32s cubic-bezier(.2, .9, .3, 1.2) both; }
  .stack > *:nth-child(2) { animation-delay: .05s; }
  .stack > *:nth-child(3) { animation-delay: .1s; }
  @keyframes rise { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: none; } }
  #repeat:active svg { transform: rotate(-90deg); transition: transform .2s ease; }
  #repeat:active { filter: brightness(.9); }
  @media (prefers-reduced-motion: reduce) {
    .bars span, .squares span, #content > *, .stack > * { animation: none; }
    body, #repeat, #repeat svg { transition: none; }
  }

  .label { font-size: 13px; font-weight: 900; letter-spacing: .15em; color: #FFE600; }
  .heard { font-size: min(30px, 7.5vw); font-weight: 800; }

  .q { padding: 28px 24px 0; font-size: 20px; font-weight: 800; color: #404040; }
  .ans { flex: 1; padding: 12px 24px; font-size: min(44px, 11vw); font-weight: 800; line-height: 1.22; overflow-y: auto; }

  .oops { font-size: min(72px, 18vw); font-weight: 900; line-height: .95; letter-spacing: -.03em; }
  body[data-state=error] .big { font-size: min(30px, 7.5vw); line-height: 1.3; }
  body[data-state=error] .mid { font-size: min(22px, 5.6vw); line-height: 1.35; }
  body[data-state=error] .small { font-size: 18px; letter-spacing: .04em; }
  .again { margin-top: 8px; border-top: 4px solid #FFE600; padding-top: 12px; font-size: 18px; font-weight: 800; color: #FFE600; }
</style>
</head>
<body data-state="start">
<video id="cam" playsinline muted aria-hidden="true"></video>
<button id="repeat">
  <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"
    stroke-linecap="square" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 3v6h6"/></svg>
  <span aria-hidden="true"><span id="repMain"></span><span id="repSub"></span></span>
</button>
<button id="pad"><div id="content" aria-hidden="true"></div></button>
<canvas id="snap" hidden></canvas>

<script>
// ---- Screen text. Hindi + English always; the user's language is added on top once Saaras detects it.
const T = {
  'hi-IN': { name: 'हिन्दी', repeat: 'दोबारा सुनें', hold: 'दबाकर पूछें', listening: 'सुन रहा हूँ…', release: 'छोड़ें तो भेजूँगा', looking: 'देख रहा हूँ…', asked: 'आपने पूछा', error: 'कुछ गड़बड़ हो गई, फिर से कोशिश कीजिए।' },
  'mr-IN': { name: 'मराठी', repeat: 'पुन्हा ऐका', hold: 'दाबून विचारा', listening: 'ऐकत आहे…', release: 'सोडल्यावर पाठवतो', looking: 'पाहत आहे…', asked: 'तुम्ही विचारले', error: 'काहीतरी चुकले, पुन्हा प्रयत्न करा.' },
  'te-IN': { name: 'తెలుగు', repeat: 'మళ్ళీ వినండి', hold: 'పట్టుకొని అడగండి', listening: 'వింటున్నాను…', release: 'వదిలితే పంపుతాను', looking: 'చూస్తున్నాను…', asked: 'మీరు అడిగింది', error: 'ఏదో తప్పు జరిగింది. మళ్ళీ ప్రయత్నించండి.' },
  'ta-IN': { name: 'தமிழ்', repeat: 'மீண்டும் கேளுங்கள்', hold: 'அழுத்திப் பிடித்துக் கேளுங்கள்', listening: 'கேட்கிறேன்…', release: 'விட்டால் அனுப்புவேன்', looking: 'பார்க்கிறேன்…', asked: 'நீங்கள் கேட்டது', error: 'ஏதோ தவறு நடந்தது. மீண்டும் முயலுங்கள்.' },
  'kn-IN': { name: 'ಕನ್ನಡ', repeat: 'ಮತ್ತೆ ಕೇಳಿ', hold: 'ಒತ್ತಿ ಹಿಡಿದು ಕೇಳಿ', listening: 'ಕೇಳುತ್ತಿದ್ದೇನೆ…', release: 'ಬಿಟ್ಟರೆ ಕಳುಹಿಸುತ್ತೇನೆ', looking: 'ನೋಡುತ್ತಿದ್ದೇನೆ…', asked: 'ನೀವು ಕೇಳಿದ್ದು', error: 'ಏನೋ ತಪ್ಪಾಗಿದೆ. ಮತ್ತೆ ಪ್ರಯತ್ನಿಸಿ.' },
  'ml-IN': { name: 'മലയാളം', repeat: 'വീണ്ടും കേൾക്കുക', hold: 'അമർത്തിപ്പിടിച്ച് ചോദിക്കുക', listening: 'കേൾക്കുന്നു…', release: 'വിട്ടാൽ അയയ്ക്കും', looking: 'നോക്കുന്നു…', asked: 'നിങ്ങൾ ചോദിച്ചത്', error: 'എന്തോ തെറ്റ് സംഭവിച്ചു. വീണ്ടും ശ്രമിക്കുക.' },
  'bn-IN': { name: 'বাংলা', repeat: 'আবার শুনুন', hold: 'চেপে ধরে জিজ্ঞেস করুন', listening: 'শুনছি…', release: 'ছাড়লে পাঠাব', looking: 'দেখছি…', asked: 'আপনি জিজ্ঞেস করেছেন', error: 'কিছু ভুল হয়েছে, আবার চেষ্টা করুন।' },
  'gu-IN': { name: 'ગુજરાતી', repeat: 'ફરી સાંભળો', hold: 'દબાવીને પૂછો', listening: 'સાંભળું છું…', release: 'છોડશો તો મોકલીશ', looking: 'જોઉં છું…', asked: 'તમે પૂછ્યું', error: 'કંઈક ખોટું થયું, ફરી પ્રયાસ કરો.' },
  'pa-IN': { name: 'ਪੰਜਾਬੀ', repeat: 'ਦੁਬਾਰਾ ਸੁਣੋ', hold: 'ਦਬਾ ਕੇ ਪੁੱਛੋ', listening: 'ਸੁਣ ਰਿਹਾ ਹਾਂ…', release: 'ਛੱਡੋ ਤਾਂ ਭੇਜਾਂਗਾ', looking: 'ਦੇਖ ਰਿਹਾ ਹਾਂ…', asked: 'ਤੁਸੀਂ ਪੁੱਛਿਆ', error: 'ਕੁਝ ਗਲਤ ਹੋ ਗਿਆ, ਦੁਬਾਰਾ ਕੋਸ਼ਿਸ਼ ਕਰੋ।' },
  'od-IN': { name: 'ଓଡ଼ିଆ', repeat: 'ପୁଣି ଶୁଣନ୍ତୁ', hold: 'ଦବାଇ ପଚାରନ୍ତୁ', listening: 'ଶୁଣୁଛି…', release: 'ଛାଡ଼ିଲେ ପଠାଇବି', looking: 'ଦେଖୁଛି…', asked: 'ଆପଣ ପଚାରିଲେ', error: 'କିଛି ଭୁଲ ହେଲା, ପୁଣି ଚେଷ୍ଟା କରନ୍ତୁ।' },
};
const EN = { repeat: 'REPEAT', hold: 'HOLD TO ASK', listening: 'LISTENING…', release: 'RELEASE TO SEND', looking: 'LOOKING…', asked: 'YOU ASKED', error: 'SOMETHING WENT WRONG. TRY AGAIN.' };
const EN_NAME = { 'mr-IN': 'MARATHI', 'te-IN': 'TELUGU', 'ta-IN': 'TAMIL', 'kn-IN': 'KANNADA', 'ml-IN': 'MALAYALAM',
  'bn-IN': 'BENGALI', 'gu-IN': 'GUJARATI', 'pa-IN': 'PUNJABI', 'od-IN': 'ODIA' };

const pad = document.getElementById('pad');
const content = document.getElementById('content');
const repeatBtn = document.getElementById('repeat');
const cam = document.getElementById('cam');
const player = new Audio();

const HOLD_MS = 400;        // pressed longer than this = hold-to-talk; shorter = tap-to-toggle
const MIN_AUDIO_MS = 600;   // shorter recordings are treated as accidental
const MAX_AUDIO_MS = 25000; // Saaras accepts up to 30 s

let stream = null, recorder = null, chunks = [], recStart = 0, pressStart = 0;
let lastAudio = null, busy = false, ctx = null, tickTimer = null, lastPointer = 0;

// ---- Language memory (per phone). Storage can be blocked, so never rely on it.
let userLang = null;
try { userLang = localStorage.getItem('aksi-lang'); } catch {}
if (!T[userLang] && userLang !== 'en-IN') userLang = null;
function setLang(l) {
  if (!T[l] && l !== 'en-IN') return;
  userLang = l;
  try { localStorage.setItem('aksi-lang', l); } catch {}
  if (stream) preloadErrorClip(l); // new language: fetch its error clip while we're online
}
// The extra line on top: only when the user's language isn't already Hindi or English
const extraLang = () => (T[userLang] && userLang !== 'hi-IN') ? userLang : null;

function lines(key) {
  const out = [];
  const x = extraLang();
  if (x) out.push({ text: T[x][key], lang: x });
  out.push({ text: T['hi-IN'][key], lang: 'hi-IN' }, { text: EN[key], lang: 'en-IN' });
  return out;
}
const joined = (key, sep = '. ') => lines(key).map((l) => l.text).join(sep);

// ---- Tiny DOM helpers (screens are rebuilt on every state change)
function el(tag, cls, text, lang) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  if (lang) e.lang = lang;
  return e;
}
function stack(list) {
  const sizes = list.length >= 3 ? ['big', 'mid', 'small'] : ['big', 'small'];
  const d = el('div', 'stack');
  list.forEach((l, i) => d.append(el('div', sizes[i] || 'small', l.text, l.lang)));
  return d;
}
function slabLine(key) {
  const s = el('div', 'slab');
  const ls = lines(key);
  s.append(el('div', 'sl1', ls[0].text, ls[0].lang), el('div', 'sl2', ls.slice(1).map((l) => l.text).join(' · ')));
  return s;
}
function spans(cls, n) {
  const d = el('div', cls);
  for (let i = 0; i < n; i++) d.append(el('span'));
  return d;
}

const screens = {
  start: () => {
    const g = el('div', 'group');
    g.append(el('div', 'rule'),
      stack([{ text: 'छूकर शुरू करें', lang: 'hi-IN' }, { text: 'TAP ANYWHERE TO START', lang: 'en-IN' }]),
      el('div', 'note', 'पहली बार छूने पर कैमरा और माइक की अनुमति माँगी जाएगी · Asks for camera + mic', 'hi-IN'));
    const logo = el('div', 'logo-wrap');
    logo.append(el('div', 'logo', 'AKSI', 'en-IN'), el('div', 'logo-sub', 'अक्षि · EYE', 'hi-IN'));
    return [logo, g];
  },
  ready: () => {
    const s = el('div', 'slab');
    const x = extraLang();
    if (x) s.append(el('div', 'tag', `${T[x].name} · ${EN_NAME[x]}`));
    s.append(stack(lines('hold')));
    return [s];
  },
  listening: () => [stack(lines('listening')), spans('bars', 9), slabLine('release')],
  looking: (o) => {
    const parts = [stack(lines('looking')), spans('squares', 3)];
    if (o.question) {
      const s = el('div', 'slab');
      s.append(el('div', 'label', joined('asked', ' · ')), el('div', 'heard', `“${o.question}”`, o.lang));
      parts.push(s);
    }
    return parts;
  },
  answer: (o) => {
    const s = slabLine('hold');
    s.style.marginTop = 'auto';
    return [el('div', 'q', o.question ? `“${o.question}”` : '', o.lang), el('div', 'ans', o.answer, o.lang), s];
  },
  error: (o) => {
    const s = el('div', 'slab');
    s.append(el('div', 'oops', 'OOPS.', 'en-IN'), stack(o.lines || lines('error')), el('div', 'again', joined('hold', ' · ')));
    return [s];
  },
};

function render(state, o = {}) {
  document.body.dataset.state = state;
  content.replaceChildren(...screens[state](o));
  const label = {
    start: 'छूकर शुरू करें. Tap to start',
    listening: joined('listening') + '. ' + joined('release'),
    looking: joined('looking'),
    error: (o.lines ? o.lines.map((l) => l.text).join('. ') : joined('error')) + '. ' + joined('hold'),
  }[state] || joined('hold');
  pad.setAttribute('aria-label', label);
  const rl = lines('repeat');
  document.getElementById('repMain').textContent = rl[0].text;
  document.getElementById('repMain').lang = rl[0].lang;
  document.getElementById('repSub').textContent = rl.slice(1).map((l) => l.text).join(' · ');
  repeatBtn.setAttribute('aria-label', rl.map((l) => l.text).join('. '));
}

// ---- Sound + vibration (no aria-live on purpose: a screen reader speaking
// "Listening" would be recorded into the question)
const buzz = (p) => navigator.vibrate && navigator.vibrate(p);
function tone(freq, ms, vol = 0.2, delayMs = 0, wave = 'sine') {
  if (!ctx) return;
  const o = ctx.createOscillator(), g = ctx.createGain();
  const t = ctx.currentTime + delayMs / 1000;
  o.type = wave; o.frequency.value = freq; g.gain.value = vol;
  o.connect(g); g.connect(ctx.destination);
  o.start(t); o.stop(t + ms / 1000);
}
// "Uh-oh": two falling buzzy notes, made on the phone so it works offline
const errorBeep = () => { tone(520, 160, 0.18, 0, 'square'); tone(330, 280, 0.18, 190, 'square'); };

// Pre-recorded "something went wrong" clips (Bulbul, made by make_sounds.py), loaded
// into memory in advance so they play even when the network is down
const errorClips = {};
async function preloadErrorClip(lang) {
  if (!lang || errorClips[lang]) return;
  try {
    const r = await fetch(`/sounds/error-${lang}.wav`);
    if (r.ok) errorClips[lang] = URL.createObjectURL(await r.blob());
  } catch {}
}
const startTicks = () => { tickTimer = setInterval(() => tone(600, 40, 0.08), 700); };
const stopTicks = () => clearInterval(tickTimer);

function play(b64) {
  player.src = 'data:audio/wav;base64,' + b64;
  return player.play();
}

// Errors: buzz + "uh-oh" beep at once, then the pre-recorded clip in the user's language.
// Setup errors (https, permission) have their own text, so the phone's own voice reads those.
function sayError(errLines) {
  render('error', { lines: errLines });
  buzz([100, 100, 100]);
  errorBeep();
  const clip = !errLines && (errorClips[userLang] || errorClips['hi-IN']);
  setTimeout(() => {
    if (clip) {
      player.src = clip;
      player.play().catch(() => {});
      return;
    }
    const ls = errLines || lines('error');
    const u = new SpeechSynthesisUtterance(ls.map((l) => l.text).join('. '));
    u.lang = ls[0].lang;
    speechSynthesis.speak(u);
  }, 550);
}

async function setup() {
  ctx = new (window.AudioContext || window.webkitAudioContext)();
  player.play().catch(() => {}); // unlock audio on this first tap
  // Browsers only allow camera/mic on https:// (or localhost)
  if (!window.isSecureContext || !navigator.mediaDevices) {
    return sayError([{ text: 'यह पेज https लिंक से खोलिए।', lang: 'hi-IN' },
      { text: 'OPEN THIS PAGE WITH AN HTTPS LINK.', lang: 'en-IN' }]);
  }
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      // Full HD if the phone can; it falls back to its best on its own
      video: { facingMode: 'environment', width: { ideal: 1920 }, height: { ideal: 1080 } }, audio: true });
  } catch (e) {
    // NotAllowedError = user/browser blocked it; NotFound/NotReadable = no working camera or mic
    if (e.name === 'NotAllowedError') {
      return sayError([{ text: 'कैमरा या माइक की अनुमति नहीं मिली।', lang: 'hi-IN' },
        { text: 'CAMERA OR MIC BLOCKED. ALLOW IT IN SITE SETTINGS, THEN RELOAD.', lang: 'en-IN' }]);
    }
    return sayError([{ text: 'कैमरा या माइक नहीं चल रहा।', lang: 'hi-IN' },
      { text: `CAMERA OR MIC NOT WORKING (${e.name}).`, lang: 'en-IN' }]);
  }
  cam.srcObject = stream;
  await cam.play();
  render('ready');
  preloadErrorClip('hi-IN');
  preloadErrorClip(userLang);
  try {
    const r = await fetch('/welcome');
    if (r.ok) play((await r.json()).audio);
  } catch {}
}

function startRecording() {
  player.pause();
  speechSynthesis.cancel();
  chunks = [];
  const audioOnly = new MediaStream(stream.getAudioTracks());
  const type = MediaRecorder.isTypeSupported('audio/webm') ? 'audio/webm' : 'audio/mp4';
  recorder = new MediaRecorder(audioOnly, { mimeType: type });
  recorder.ondataavailable = (e) => chunks.push(e.data);
  recorder.start();
  recStart = Date.now();
  buzz(60); tone(880, 120);
  render('listening');
  const mine = recorder;
  setTimeout(() => { if (recorder === mine && mine.state === 'recording') finishRecording(); }, MAX_AUDIO_MS);
}

function snapPhoto() {
  const c = document.getElementById('snap');
  // 1024px keeps small print (medicine strips, labels) readable; bigger mostly adds upload time
  const scale = Math.min(1, 1024 / Math.max(cam.videoWidth, cam.videoHeight));
  c.width = Math.round(cam.videoWidth * scale);
  c.height = Math.round(cam.videoHeight * scale);
  const g = c.getContext('2d');
  g.imageSmoothingQuality = 'high';
  g.drawImage(cam, 0, 0, c.width, c.height);
  return new Promise((res) => c.toBlob(res, 'image/jpeg', 0.85));
}

async function postForm(url, fields) {
  const form = new FormData();
  for (const [k, v] of fields) Array.isArray(v) ? form.append(k, ...v) : form.append(k, v);
  const r = await fetch(url, { method: 'POST', body: form });
  if (!r.ok) throw new Error(await r.text());
  return r.json();
}

async function finishRecording() {
  const rec = recorder;
  recorder = null;
  const type = rec.mimeType.split(';')[0];
  const stopped = new Promise((res) => (rec.onstop = res));
  rec.stop();
  await stopped;

  if (Date.now() - recStart < MIN_AUDIO_MS) { // accidental touch
    tone(300, 80);
    render('ready');
    return;
  }

  busy = true;
  buzz(40); tone(440, 120);
  render('looking');
  startTicks();
  try {
    const photo = await snapPhoto(); // the moment they let go
    // 1) Saaras: what did they say, and in which language?
    const heard = await postForm('/listen', [
      ['audio', [new Blob(chunks, { type }), type === 'audio/mp4' ? 'q.mp4' : 'q.webm']]]);
    if (heard.question) {
      setLang(heard.lang);
      render('looking', { question: heard.question, lang: heard.lang });
    }
    // 2) Gemma looks at the photo, Bulbul speaks the answer
    const data = await postForm('/answer', [
      ['image', [photo, 'photo.jpg']], ['question', heard.question], ['lang', heard.lang]]);
    stopTicks();
    lastAudio = data.audio;
    render('answer', { question: heard.question, answer: data.answer, lang: data.lang });
    console.log(data.lang, data.timings);
    play(data.audio);
  } catch (e) {
    stopTicks();
    console.error(e);
    sayError();
  } finally {
    busy = false;
  }
}

// One press handler for touch, mouse, keyboard and TalkBack double-tap:
// press while idle starts recording; press while recording (tap mode) sends it.
function press() {
  if (!stream) return setup();
  if (busy) return;
  if (recorder) return finishRecording();
  pressStart = Date.now();
  startRecording();
}
// Release after a long press = hold-to-talk, so send. After a short tap, keep recording.
function release() {
  if (recorder && recorder.state === 'recording' && Date.now() - pressStart >= HOLD_MS) finishRecording();
}

pad.addEventListener('pointerdown', (e) => { e.preventDefault(); lastPointer = Date.now(); press(); });
pad.addEventListener('pointerup', release);
pad.addEventListener('pointercancel', release);
// Some screen readers send only a click, with no pointer events
pad.addEventListener('click', () => { if (Date.now() - lastPointer > 800) press(); });
pad.addEventListener('keydown', (e) => {
  if ((e.key === ' ' || e.key === 'Enter') && !e.repeat) { e.preventDefault(); press(); }
});

repeatBtn.addEventListener('click', () => {
  if (!stream) return setup();
  if (recorder || busy) return;
  if (lastAudio) play(lastAudio);
  else { tone(300, 80); buzz(30); }
});

document.addEventListener('contextmenu', (e) => e.preventDefault());
render('start');
pad.focus();

// Preview helper for design review: open /?preview=listening&lang=te-IN to see a screen without the camera
const pv = new URLSearchParams(location.search);
if (pv.get('preview')) {
  if (pv.get('lang')) setLang(pv.get('lang'));
  const q = { 'te-IN': 'ఇది ఏ మందు?', 'mr-IN': 'हे कोणते औषध आहे?' }[userLang] || 'यह कौन सी दवा है?';
  render(pv.get('preview'), { question: q, answer: 'Paracetamol 500 mg. Expiry: August 2027.', lang: userLang });
}
</script>
